# =====================================================================
# GMS (Gym Management System) — Nginx + PHP-FPM en Termux/Android
# Dominio público: https://gym.saul-dev.com (vía Cloudflare Tunnel)
# Copiar a: $PREFIX/etc/nginx/sites-enabled/gms (o incluir desde nginx.conf)
# Recargar con: nginx -t && nginx -s reload
# =====================================================================

server {
    # --- Puerto 80 local: Cloudflare Tunnel (cloudflared) hace forward
    # --- aquí. El TLS termina en el borde de Cloudflare.
    listen 80;
    server_name gym.saul-dev.com;

    # --- Raíz del proyecto en Termux. Ajusta si tu carpeta es otra.
    # --- Ejemplo: /data/data/com.termux/files/home/GMS
    root /data/data/com.termux/files/home/GMS;
    index index.php;

    # --- Límite de cuerpo: comprobantes de 5MB + holgura de multipart.
    client_max_body_size 6M;

    # --- 404 en vez de 403 en los deny: no revelar qué existe.
    # --- Bloquea /.git, /.env, /.gitignore (regex sobre la URI).
    location ~ /\.(git|env|gitignore) {
        return 404;
    }

    # --- Bloquea código interno: nunca debe servirse directo.
    location ~ ^/(includes|php_action|config|database|tests|vendor|bin|deploy)/ {
        return 404;
    }

    # --- /uploads/ y /storage/ quedan TOTALMENTE bloqueados por HTTP.
    # --- Tras la Fase 5 + migración, ningún archivo servible vive ahí:
    # --- los comprobantes se sirven solo vía api/ver_archivo.php
    # --- (con sesión o enlace firmado). 404 en vez de 403 para no
    # --- revelar qué existe. ^~ tiene prioridad sobre el resto.
    location ^~ /uploads/ {
        return 404;
    }

    location ^~ /storage/ {
        return 404;
    }

    # --- Front controller simple: archivos existentes se sirven,
    # --- lo demás va a index.php (el login).
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # --- PHP vía PHP-FPM. En Termux php-fpm escucha por defecto en
    # --- 127.0.0.1:9000. Verifica con: netstat -tlnp | grep 9000
    # --- Si usas socket unix, cambia a: unix:/data/data/com.termux/.../php-fpm.sock
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS $http_x_forwarded_proto if_not_empty;
    }

    # --- Cabeceras de seguridad (always: también en errores y 404).
    # --- No permiten sniffing de MIME (evita que un archivo subido
    # --- se ejecute como otro tipo).
    add_header X-Content-Type-Options "nosniff" always;
    # --- Prohíbe embeber el panel en iframes (anti clickjacking).
    # --- (CSP frame-ancestors lo refuerza; se deja por compatibilidad.)
    add_header X-Frame-Options "DENY" always;
    # --- El navegador manda el origen (no la URL completa) al navegar.
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # --- Apaga APIs que el gym no usa (cámara, micro, geolocalización).
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # --- Fuerza HTTPS por 1 año incluyendo subdominios.
    # --- Cloudflare ya sirve HTTPS al borde; esta cabecera la hereda
    # --- el navegador desde la respuesta (pasa por el túnel).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # --- CSP: solo 'self' + los CDNs que el proyecto usa de verdad.
    # --- script-src: jsdelivr (bootstrap/popper/sweetalert/toastify),
    # ---   cdnjs (font-awesome), code.jquery.com (jquery),
    # ---   challenges.cloudflare.com (widget Turnstile del portal).
    # ---   Turnstile y Google Fonts NO llevan SRI: su contenido varía
    # ---   por navegador/rotación y el hash se rompería.
    # --- frame-src 'self' + Turnstile: los comprobantes PDF se
    # ---   previsualizan en <iframe> del mismo origen.
    # --- Sin 'unsafe-inline': todo el JS vive en /js (ver Fase 6.2).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://code.jquery.com https://challenges.cloudflare.com; style-src 'self' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com data:; img-src 'self' data:; frame-src 'self' https://challenges.cloudflare.com; connect-src 'self' https://challenges.cloudflare.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
}
